<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — FireDash</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/app.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3">
            <i class="bi bi-person-plus-fill fs-2 text-primary"></i>
          </div>
          <h1 class="h3 fw-bold">Crear cuenta</h1>
          <p class="text-body-secondary small">Únete a FireDash hoy</p>
        </div>

        <div id="alert-box" class="alert d-none" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label small fw-medium" for="firstName">Nombre</label>
              <input type="text" class="form-control" id="firstName" placeholder="Juan" required />
            </div>
            <div class="col-6">
              <label class="form-label small fw-medium" for="lastName">Apellido</label>
              <input type="text" class="form-control" id="lastName" placeholder="García" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="email">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="tu@correo.com" required />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="password">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Mín. 8 caracteres" required minlength="8" />
              <button class="btn btn-outline-secondary" type="button" id="toggle-pw">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <!-- Strength meter -->
            <div class="mt-2">
              <div class="progress" style="height:4px;">
                <div class="progress-bar" id="strength-bar" role="progressbar" style="width:0%"></div>
              </div>
              <small class="text-body-secondary" id="strength-label"></small>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="password2">Confirmar contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="password2" placeholder="Repite la contraseña" required />
            </div>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="terms" required />
            <label class="form-check-label small" for="terms">
              Acepto los <a href="#" class="text-primary">términos y condiciones</a>
            </label>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-register">
            <span class="btn-text">Crear cuenta</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" id="spin-register"></span>
          </button>
        </form>

        <div class="divider my-4">
          <span class="divider-text text-body-secondary small">o regístrate con</span>
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-outline-secondary social-btn" id="btn-google">
            <svg class="social-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continuar con Google
          </button>
          <button class="btn btn-outline-secondary social-btn" id="btn-github">
            <i class="bi bi-github me-2"></i> Continuar con GitHub
          </button>
        </div>

        <p class="text-center text-body-secondary small mt-4 mb-0">
          ¿Ya tienes cuenta?
          <a href="../index.html" class="text-primary fw-medium text-decoration-none">Inicia sesión</a>
        </p>

      </div>
    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/register.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
