<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — FireDash</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="../css/app.css" rel="stylesheet" />
</head>
<body class="app-body">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-icon-sm"><i class="bi bi-shield-lock-fill text-primary"></i></div>
      <span class="brand-name fw-bold">FireDash</span>
      <button class="btn btn-link d-lg-none ms-auto p-0 text-body-secondary" id="sidebar-close"><i class="bi bi-x-lg"></i></button>
    </div>
    <ul class="sidebar-nav">
      <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li class="nav-item"><a href="profile.html" class="nav-link active"><i class="bi bi-person-circle"></i> Perfil</a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link"><i class="bi bi-gear"></i> Configuración</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2 px-3 py-2">
        <img src="" alt="avatar" class="rounded-circle sidebar-avatar" id="sidebar-avatar" width="32" height="32" />
        <div class="overflow-hidden">
          <p class="mb-0 small fw-medium text-truncate" id="sidebar-name">—</p>
          <p class="mb-0 text-body-secondary" style="font-size:11px" id="sidebar-email">—</p>
        </div>
      </div>
      <button class="btn btn-outline-danger btn-sm mt-2 mx-3" id="btn-logout">
        <i class="bi bi-box-arrow-right me-1"></i> Salir
      </button>
    </div>
  </nav>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main-content">
    <header class="topbar">
      <button class="btn btn-link d-lg-none p-0 text-body-secondary" id="sidebar-toggle"><i class="bi bi-list fs-4"></i></button>
      <div class="topbar-title"><h5 class="mb-0 fw-semibold">Mi Perfil</h5></div>
      <div class="ms-auto">
        <img src="" alt="avatar" class="rounded-circle topbar-avatar" id="topbar-avatar" width="36" height="36" />
      </div>
    </header>

    <main class="page-content">

      <div id="alert-box" class="alert d-none mb-4" role="alert"></div>

      <div class="row g-4">

        <!-- Avatar / identity card -->
        <div class="col-lg-4">
          <div class="card border-0">
            <div class="card-body text-center p-4">
              <div class="position-relative d-inline-block mb-3">
                <img src="" alt="avatar" class="rounded-circle profile-avatar-lg" id="profile-avatar" width="100" height="100" />
                <span class="provider-badge" id="provider-badge">
                  <i class="bi bi-google" id="provider-icon"></i>
                </span>
              </div>
              <h5 class="fw-bold mb-0" id="display-name-text">—</h5>
              <p class="text-body-secondary small mb-3" id="display-email">—</p>

              <!-- Verified badge -->
              <div id="verified-badge-wrap"></div>

              <hr class="border-subtle" />

              <div class="text-start">
                <p class="text-body-secondary small mb-1">UID</p>
                <p class="font-monospace small text-truncate mb-3" id="uid-text">—</p>
                <p class="text-body-secondary small mb-1">Miembro desde</p>
                <p class="small fw-medium mb-3" id="created-text">—</p>
                <p class="text-body-secondary small mb-1">Proveedores</p>
                <div id="providers-list" class="d-flex flex-wrap gap-1"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Edit form -->
        <div class="col-lg-8">
          <div class="card border-0 mb-3">
            <div class="card-header border-0">
              <h6 class="fw-semibold mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Información personal</h6>
            </div>
            <div class="card-body">
              <form id="profile-form" novalidate>
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label small fw-medium">Nombre</label>
                    <input type="text" class="form-control" id="f-firstName" placeholder="Nombre" />
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-medium">Apellido</label>
                    <input type="text" class="form-control" id="f-lastName" placeholder="Apellido" />
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-medium">Correo electrónico</label>
                    <input type="email" class="form-control" id="f-email" disabled />
                    <div class="form-text">El email no puede cambiarse directamente.</div>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-medium">Teléfono</label>
                    <input type="tel" class="form-control" id="f-phone" placeholder="+52 55 0000 0000" />
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label small fw-medium">Ciudad</label>
                    <input type="text" class="form-control" id="f-city" placeholder="Ciudad de México" />
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-medium">Biografía</label>
                    <textarea class="form-control" id="f-bio" rows="3" placeholder="Cuéntanos algo sobre ti..."></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-medium">Sitio web</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                      <input type="url" class="form-control" id="f-website" placeholder="https://tuweb.com" />
                    </div>
                  </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                  <button type="submit" class="btn btn-primary px-4" id="btn-save-profile">
                    <span class="btn-text">Guardar cambios</span>
                    <span class="spinner-border spinner-border-sm d-none ms-2" id="spin-profile"></span>
                  </button>
                  <button type="button" class="btn btn-outline-secondary" id="btn-cancel">Cancelar</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Photo URL -->
          <div class="card border-0">
            <div class="card-header border-0">
              <h6 class="fw-semibold mb-0"><i class="bi bi-image me-2 text-info"></i>Foto de perfil</h6>
            </div>
            <div class="card-body">
              <div class="input-group">
                <input type="url" class="form-control" id="f-photoURL" placeholder="https://ejemplo.com/foto.jpg" />
                <button class="btn btn-outline-primary" id="btn-save-photo">Actualizar</button>
              </div>
              <div class="form-text">Ingresa una URL pública de imagen.</div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/profile.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
