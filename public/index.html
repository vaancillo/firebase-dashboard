<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FireDash</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">

        <!-- Logo -->
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3">
            <i class="bi bi-shield-lock-fill fs-2 text-primary"></i>
          </div>
          <h1 class="h3 fw-bold">FireDash</h1>
          <p class="text-body-secondary small">Inicia sesión en tu cuenta</p>
        </div>

        <!-- Alert -->
        <div id="alert-box" class="alert d-none" role="alert"></div>

        <!-- Email Form -->
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-medium" for="email">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="tu@correo.com" required />
            </div>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-medium mb-0" for="password">Contraseña</label>
              <a href="#" class="small text-primary text-decoration-none" id="forgot-link">¿Olvidaste la contraseña?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required />
              <button class="btn btn-outline-secondary" type="button" id="toggle-pw">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label small" for="remember">Mantener sesión iniciada</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-login">
            <span class="btn-text">Iniciar sesión</span>
            <span class="spinner-border spinner-border-sm d-none ms-2" id="spin-login"></span>
          </button>
        </form>

        <!-- Divider -->
        <div class="divider my-4">
          <span class="divider-text text-body-secondary small">o continúa con</span>
        </div>

        <!-- Social Providers -->
        <div class="d-grid gap-2">
          <button class="btn btn-outline-secondary social-btn" id="btn-google">
            <svg class="social-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continuar con Google
          </button>
          <button class="btn btn-outline-secondary social-btn" id="btn-github">
            <i class="bi bi-github me-2"></i> Continuar con GitHub
          </button>
          <button class="btn btn-outline-secondary social-btn" id="btn-facebook">
            <i class="bi bi-facebook me-2" style="color:#1877f2"></i> Continuar con Facebook
          </button>
        </div>

        <!-- Register link -->
        <p class="text-center text-body-secondary small mt-4 mb-0">
          ¿No tienes cuenta?
          <a href="pages/register.html" class="text-primary fw-medium text-decoration-none">Regístrate</a>
        </p>

      </div>
    </div>

    <p class="text-center text-body-secondary small mt-3">
      &copy; 2025 FireDash — Powered by Firebase
    </p>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
